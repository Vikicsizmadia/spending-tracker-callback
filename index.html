<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spending Tracker</title>
<style>
body{font-family:system-ui,sans-serif;background:#f6f1e7;color:#1d2b24;margin:0;padding:40px 24px;text-align:center}
a{display:inline-block;margin-top:24px;padding:16px 28px;border-radius:28px;background:#1f5d4a;color:#fff;font-size:18px;text-decoration:none}
</style>
</head>
<body>
<h2>Bank approved</h2>
<p>Return to Spending Tracker to finish connecting.</p>
<a id="open" href="#">Open Spending Tracker</a>
<script>
// Hands the one-time code from the bank straight to the app. Nothing is stored or sent anywhere else.
var target = "intent://enablebanking" + location.search + "#Intent;scheme=app.spendingtracker;package=app.spendingtracker;end";
document.getElementById("open").href = target;
setTimeout(function () { location.href = target; }, 300);
</script>
</body>
</html>
